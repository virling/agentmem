name: ciwhy

on:
  workflow_run:
    workflows: [test]
    types: [completed]

jobs:
  ciwhy:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: virling/ciwhy@fb039ec0d05bc5644dcc15314a8b44a33627d53f # v0.2.2
