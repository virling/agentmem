name: agentmem guardrails
description: Fail pull requests that change files protected by agentmem block guardrails, and warn on warn guardrails
author: Virling
branding:
  icon: shield
  color: purple

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Check guarded files
      shell: bash
      env:
        BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      run: |
        base=HEAD^1
        if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
          git fetch --quiet --depth=1 origin "$BEFORE"
          base="$BEFORE"
        fi
        node "$GITHUB_ACTION_PATH/../bin/agentmem.js" guard-check --base "$base"
